name: Publish sing-box build

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - testing
          - stable
          - oldstable
        default: testing
      build_run_id:
        description: 'Successful build workflow run ID'
        required: true
        type: string
      publish_release:
        description: 'Publish type'
        required: true
        type: choice
        options:
          - pre-release
          - release
        default: pre-release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.channel }} build ${{ inputs.build_run_id }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release channel
        id: channel
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            testing)
              workflow='.github/workflows/build-testing.yml'
              build_info_file='testing-build-info.json'
              ;;
            stable)
              workflow='.github/workflows/build-stable.yml'
              build_info_file='stable-build-info.json'
              ;;
            oldstable)
              workflow='.github/workflows/build-oldstable.yml'
              build_info_file='oldstable-build-info.json'
              ;;
            *)
              echo "unsupported release channel: $CHANNEL" >&2
              exit 1
              ;;
          esac
          {
            echo "workflow=$workflow"
            echo "build_info_file=$build_info_file"
          } >> "$GITHUB_OUTPUT"

      - name: Validate build workflow run
        id: build_run
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BRANCH: ${{ github.ref_name }}
          EXPECTED_WORKFLOW: ${{ steps.channel.outputs.workflow }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "invalid build run ID: $BUILD_RUN_ID" >&2
            exit 1
          fi

          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")
          workflow_id=$(jq -r '.workflow_id' <<< "$run_json")
          workflow_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id")

          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$EXPECTED_BRANCH" \
            '.repository.full_name == $repository
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"
              and .head_branch == $branch' \
            <<< "$run_json" >/dev/null
          jq -e \
            --arg workflow "$EXPECTED_WORKFLOW" \
            '.path == $workflow' \
            <<< "$workflow_json" >/dev/null

          echo "head_sha=$(jq -r '.head_sha' <<< "$run_json")" >> "$GITHUB_OUTPUT"

      - name: Download build manifest
        uses: actions/download-artifact@v8
        with:
          name: build-manifest
          path: build-metadata
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Validate build manifest
        id: manifest
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_BRANCH: ${{ github.ref_name }}
          EXPECTED_HEAD_SHA: ${{ steps.build_run.outputs.head_sha }}
          EXPECTED_WORKFLOW: ${{ steps.channel.outputs.workflow }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          manifest=build-metadata/build-manifest.json
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$EXPECTED_BRANCH" \
            --arg head_sha "$EXPECTED_HEAD_SHA" \
            --arg workflow "$EXPECTED_WORKFLOW" \
            --arg channel "$CHANNEL" \
            --argjson run_id "$BUILD_RUN_ID" \
            '.schema_version == 1
              and .workflow == $workflow
              and .repository == $repository
              and .head_branch == $branch
              and .head_sha == $head_sha
              and .run_id == $run_id
              and (.version | test("^[0-9A-Za-z][0-9A-Za-z.+-]*$"))
              and (.source_sha | test("^[0-9a-f]{40}$"))
              and ((($channel == "oldstable") and .core_base_version == null) or
                (((.core_base_version // "") | test("^[0-9A-Za-z][0-9A-Za-z.+-]*$"))
                  and .core_version == (.core_base_version + "-" + (.source_sha[0:9]))
                  and ((.source_repository // "") | test("^[0-9A-Za-z_.-]+/[0-9A-Za-z_.-]+$"))
                  and ((.source_ref // "") | type == "string" and length > 0)
                  and .sources.core.repository == .source_repository
                  and .sources.core.ref == .source_ref
                  and .sources.core.sha == .source_sha
                  and ((.sources.android_gui.repository // "") | test("^[0-9A-Za-z_.-]+/[0-9A-Za-z_.-]+$"))
                  and ((.sources.android_gui.ref // "") | type == "string" and length > 0)
                  and ((.sources.android_gui.sha // "") | test("^[0-9a-f]{40}$"))
                  and (($channel == "oldstable") or
                    (((.sources.desktop_gui.repository // "") | test("^[0-9A-Za-z_.-]+/[0-9A-Za-z_.-]+$"))
                      and ((.sources.desktop_gui.ref // "") | type == "string" and length > 0)
                      and ((.sources.desktop_gui.sha // "") | test("^[0-9a-f]{40}$"))))))
              and (.built_at | type == "string" and length > 0)
              and (.build.cli | type == "boolean")
              and (.build.android_gui | type == "boolean")
              and (.build.windows_gui | type == "boolean")
              and (.build.linux_gui | type == "boolean")
              and (($channel == "testing" or $channel == "stable") or
                (.build.windows_gui == false and .build.linux_gui == false))
              and (.artifacts | type == "array" and length > 0)
              and ((.artifacts | map(.path) | unique | length) == (.artifacts | length))
              and all(.artifacts[];
                (.path | type == "string" and length > 0)
                and (.path | startswith("/") | not)
                and (.path | split("/") | all(. != ".."))
                and (.sha256 | test("^[0-9a-f]{64}$"))
                and (.size | type == "number" and . >= 0))' \
            "$manifest" >/dev/null

          {
            echo "version=$(jq -r '.version' "$manifest")"
            echo "core_base_version=$(jq -r '.core_base_version // empty' "$manifest")"
            echo "core_version=$(jq -r '.core_version // .version' "$manifest")"
            echo "source_repository=$(jq -r --arg channel "$CHANNEL" \
              '.source_repository // (if $channel == "oldstable" then "reF1nd/sing-box" else empty end)' "$manifest")"
            echo "source_ref=$(jq -r '.source_ref // .source_branch // empty' "$manifest")"
            echo "source_sha=$(jq -r '.source_sha' "$manifest")"
            echo "built_at=$(jq -r '.built_at' "$manifest")"
            echo "build_cli=$(jq -r '.build.cli' "$manifest")"
            echo "build_android_gui=$(jq -r '.build.android_gui' "$manifest")"
            echo "build_windows_gui=$(jq -r '.build.windows_gui' "$manifest")"
            echo "build_linux_gui=$(jq -r '.build.linux_gui' "$manifest")"
          } >> "$GITHUB_OUTPUT"

      - name: Download CLI artifacts
        if: steps.manifest.outputs.build_cli == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Download Android artifacts
        if: steps.manifest.outputs.build_android_gui == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: android-apk-*
          path: artifacts
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Download Windows GUI artifacts
        if: inputs.channel != 'oldstable' && steps.manifest.outputs.build_windows_gui == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: windows-gui-*
          path: artifacts
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Download Linux GUI artifacts
        if: inputs.channel != 'oldstable' && steps.manifest.outputs.build_linux_gui == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: linux-gui-*
          path: artifacts
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Verify artifact files
        run: |
          set -euo pipefail
          jq -S '.artifacts | sort_by(.path)' \
            build-metadata/build-manifest.json > expected-artifacts.json

          {
            while IFS= read -r -d '' file; do
              relative_path=${file#artifacts/}
              sha256=$(sha256sum "$file" | awk '{print $1}')
              size=$(stat -c '%s' "$file")
              jq -nc \
                --arg path "$relative_path" \
                --arg sha256 "$sha256" \
                --argjson size "$size" \
                '{path: $path, sha256: $sha256, size: $size}'
            done < <(find artifacts -type f -print0 | sort -z)
          } | jq -s -S 'sort_by(.path)' > actual-artifacts.json

          diff -u expected-artifacts.json actual-artifacts.json

      - name: Generate build info and release notes
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
          CORE_BASE_VERSION: ${{ steps.manifest.outputs.core_base_version }}
          CORE_VERSION: ${{ steps.manifest.outputs.core_version }}
          SOURCE_REPOSITORY: ${{ steps.manifest.outputs.source_repository }}
          SOURCE_REF: ${{ steps.manifest.outputs.source_ref }}
          SOURCE_SHA: ${{ steps.manifest.outputs.source_sha }}
          BUILT_AT: ${{ steps.manifest.outputs.built_at }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          CHANNEL: ${{ inputs.channel }}
          BUILD_INFO_FILE: ${{ steps.channel.outputs.build_info_file }}
        run: |
          set -euo pipefail
          jq \
            --arg version "$VERSION" \
            --arg core_base_version "$CORE_BASE_VERSION" \
            --arg core_version "$CORE_VERSION" \
            --arg source_repository "$SOURCE_REPOSITORY" \
            --arg source_ref "$SOURCE_REF" \
            --arg built_at "$BUILT_AT" \
            --arg run_id "$BUILD_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            '.version = $version
              | if $core_base_version == "" then del(.core_base_version) else .core_base_version = $core_base_version end
              | .core_version = $core_version
              | .source_repository = $source_repository
              | del(.source_branch)
              | if $source_ref == "" then del(.source_ref) else .source_ref = $source_ref end
              | .built_at = $built_at
              | .run_id = $run_id
              | .source_sha = $source_sha' \
            "$BUILD_INFO_FILE" > updated-build-info.json
          mv updated-build-info.json "$BUILD_INFO_FILE"

          published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "## Release v${VERSION}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Channel | \`${CHANNEL}\` |"
            echo "| Release / GUI Version | \`${VERSION}\` |"
            echo "| sing-box Core Version | \`${CORE_VERSION}\` |"
            echo "| sing-box Commit | [\`${SOURCE_SHA}\`](https://github.com/${SOURCE_REPOSITORY}/commit/${SOURCE_SHA}) |"
            if [[ -n "$SOURCE_REF" ]]; then
              echo "| sing-box Source | [\`${SOURCE_REPOSITORY}:${SOURCE_REF}\`](https://github.com/${SOURCE_REPOSITORY}/tree/${SOURCE_REF}) |"
            else
              echo "| sing-box Source | [\`${SOURCE_REPOSITORY}\`](https://github.com/${SOURCE_REPOSITORY}) |"
            fi
            echo "| Built At | ${BUILT_AT} |"
            echo "| Published At | ${published_at} |"
            echo "| Build Run ID | [${BUILD_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}) |"
            echo "| Publish Run ID | [${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
          } > release-notes.md

      - name: Commit updated build info
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
          BUILD_INFO_FILE: ${{ steps.channel.outputs.build_info_file }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$BUILD_INFO_FILE"
          if git diff --cached --quiet; then
            echo "$BUILD_INFO_FILE is already up to date"
          else
            git commit -m "Release v${VERSION}"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Delete existing release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git push origin ":refs/tags/${tag}"
          fi

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release_files
          find artifacts -type f -exec cp '{}' release_files/ ';'

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.manifest.outputs.version }}
          name: v${{ steps.manifest.outputs.version }}
          prerelease: ${{ inputs.publish_release == 'pre-release' }}
          body_path: release-notes.md
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
